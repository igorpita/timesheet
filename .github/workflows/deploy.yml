name: Publicar na Nextcloud App Store

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências e compilar frontend
        run: |
          npm ci
          npm run build

      - name: Empacotar e Publicar na Nextcloud App Store
        uses: nextcloud/app-store-publisher@v1
        with:
          app-id: oab_timesheet
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          app-store-token: ${{ secrets.APP_STORE_TOKEN }}

