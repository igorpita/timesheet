name: Publicar na Nextcloud App Store

on:
  workflow_dispatch:
    inputs:
      test_secrets_only:
        description: 'Apenas testar se os segredos estão corretos (sem publicar)'
        type: boolean
        default: true
  release:
    types: [published]

jobs:
  test-secrets:
    name: Validar Segredos do Repositório
    runs-on: ubuntu-latest
    steps:
      - name: Validar APP_STORE_TOKEN
        env:
          TOKEN: ${{ secrets.APP_STORE_TOKEN || secrets.APPSTORE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "❌ ERRO: Segredo de Token não encontrado! Verifique se criou com o nome APP_STORE_TOKEN ou APPSTORE_TOKEN."
            exit 1
          fi
          echo "Token detectado (Tamanho: ${#TOKEN} caracteres)."
          
          # Testa autenticação chamando a API de releases com payload vazio
          RESP=$(curl -s -X POST -H "Authorization: Token $TOKEN" -H "Content-Type: application/json" -d '{}' https://apps.nextcloud.com/api/v1/apps/releases)
          if echo "$RESP" | grep -q "Invalid token"; then
            echo "❌ ERRO: A Nextcloud Store rejeitou o token (Invalid token). Verifique se copiou o token completo."
            exit 1
          else
            echo "✅ APP_STORE_TOKEN autenticado com sucesso na Nextcloud Store!"
          fi

      - name: Validar APP_PRIVATE_KEY
        env:
          KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.APP_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "❌ ERRO: Segredo de Chave Privada não encontrado! Verifique se criou com o nome APP_PRIVATE_KEY ou APP_KEY."
            exit 1
          fi
          echo "Chave detectada (Tamanho: ${#KEY} caracteres)."
          echo "$KEY" | openssl rsa -check -noout
          echo "✅ APP_PRIVATE_KEY é uma chave RSA válida e íntegra!"

  build-and-publish:
    name: Compilar, Assinar e Publicar
    needs: test-secrets
    if: ${{ github.event.inputs.test_secrets_only != 'true' && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências e compilar frontend
        run: |
          npm ci
          npm run build

      - name: Empacotar e Publicar na Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: oab_timesheet
          app_private_key: ${{ secrets.APP_PRIVATE_KEY || secrets.APP_KEY }}
          appstore_token: ${{ secrets.APP_STORE_TOKEN || secrets.APPSTORE_TOKEN }}
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/oab_timesheet.tar.gz
